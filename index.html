const BITS=[[0,0,1],[0,1,2],[0,2,4],[1,0,8],[1,1,16],[1,2,32],[0,3,64],[1,3,128]];
const rows=ART.split("\n"), C=[...rows[0]].length, R=rows.length;
const W=C*2, H=R*4, cell=12, cv=document.getElementById("c"), ctx=cv.getContext("2d");
let inv=false;
function draw(){
  const dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=W*cell*dpr/2; cv.height=H*cell*dpr/2;
  ctx.setTransform(dpr/2,0,0,dpr/2,0,0);
  ctx.fillStyle=inv?"#0e0e10":"#f4f1ea"; ctx.fillRect(0,0,W*cell,H*cell);
  ctx.fillStyle=inv?"#f4f1ea":"#111";
  rows.forEach((line,r)=>{[...line].forEach((ch,c)=>{
    const v=ch.codePointAt(0)-0x2800;
    for(const [dx,dy,b] of BITS){ if(v&b){
      ctx.beginPath();
      ctx.arc((c*2+dx+.5)*cell,(r*4+dy+.5)*cell,cell*.42,0,Math.PI*2);
      ctx.fill();
    }}
  })});
}
draw();
document.getElementById("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(ART);msg("Copiado. Cole dentro de ``` pra manter alinhado.")}
  catch(e){msg("Não deu pra copiar neste navegador.")}
};
function msg(t){const m=document.getElementById("msg");m.textContent=t;setTimeout(()=>m.textContent="",3000)}
</script>
